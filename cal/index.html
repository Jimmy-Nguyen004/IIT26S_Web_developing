<!DOCTYPE html>
<html>
<head>
  <title>Calculators</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Task 1. Calculator with text box and dropdown list</h2>
  <input type="number" id="num1a" value="10">
  <select id="operator-1">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
  </select>
  <input type="number" id="num1b" value="5">
  <button id="equals1" onclick="calc1()">=</button>
  <span id="result1">Press = mark!</span>

  <h2>Task 2. Calculator with text box and option buttons</h2>
  <input type="number" id="num2a" value="10"><br>
  <input type="radio" id="add" name="operator-2" value="+" checked>
  <label for="add">Addition</label><br>
  <input type="radio" id="sub" name="operator-2" value="-">
  <label for="sub">Subtraction</label><br>
  <input type="radio" id="mul" name="operator-2" value="*">
  <label for="mul">Multiplication</label><br>
  <input type="radio" id="div" name="operator-2" value="/">
  <label for="div">Division</label><br>
  <input type="number" id="num2b" value="5">
  <button id="equals2" onclick="calc2()">=</button>
  <span id="result2">Press = mark!</span>

  <h2>Task 3. Calculator with text box and increment/decrement buttons</h2>
  <button id="dec3a" onclick="change('num3a', -1)">&#9660;</button>
  <input type="number" id="num3a" value="10">
  <button id="inc3a" onclick="change('num3a', 1)">&#9650;</button>
  <select id="operator-3">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
  </select>
  <button id="dec3b" onclick="change('num3b', -1)">&#9660;</button>
  <input type="number" id="num3b" value="10">
  <button id="inc3b" onclick="change('num3b', 1)">&#9650;</button>
  <button id="equals3" onclick="calc3()">=</button>
  <span id="result3">Press = mark!</span>

  <script src="script.js"></script>
</body>
</html>
