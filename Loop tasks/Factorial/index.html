<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Factorial N!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Factorial N!</h1>
    <p class="description">N! = 1 x 2 x 3 x ... x N. For example: 5! = 120. By definition 0! = 1, and the factorial of a negative number is unspecified.</p>
    <div class="panel">
        <label for="n">Enter N</label>
        <div class="row">
            <input id="n" type="number" step="1" value="5" inputmode="numeric">
            <button id="go">Calculate</button>
        </div>
        <div class="answer" id="out" aria-live="polite"></div>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
