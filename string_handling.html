<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>String Handling</title>
        <style>
            body { font-family:Arial, sans-serif; background:#8e99a1; padding:40px;}
            .box { background: white; max-width:450px; margin:auto; padding:40px; border-radius:8px; box-shadow:0 2px 6px rbg(0,0,0,0.2)}
            input { width:95%; padding:8px; margin:10px 0;}
            button { padding:8px 16px; background: #2b6cb0; color:white; border:none; border-radius:4px; cursor:pointer}
            button:hover { background:#2c5282}
            .result { margin-top:12px; padding:10px; background:#edf2f7; border-radius:4px;}
            .result span {font-weight:bold;}
        </style>
    </head>
    <body>
        <div class="box">
            <h2>String Handling</h2>
            <input type="text" id="text" placeholder="Enter a word or a phrase">
            <button onclick="runAll()">Check</button>

            <div class="result">Task 1: <span id="task1"></span></div>
            <div class="result">Task 2: <span id="task2"></span></div>
            <div class="result">Task 3: <span id="task3"></span></div>
        </div>
        <script>
            function countL(text) {
                let count = 0;
                for (let char of text.toLowerCase()) {
                    if (char === "l") {
                        count++;
                    }
                }
                return text + " contains " + count + "xL characters.";
            }

            function countVowels(text) {
                let vowels = "aeiouyåäö";
                let count = 0;
                for (let char of text.toLowerCase()) {
                    if (vowels.includes(char)) {
                        count++;
                    }
                }
                return text + " contains " + count + "vowels."
            }

            function checkPalindrome(text) {
                let original = text.toLowerCase().replaceAll(" ","");
                let reversed = original.split("").reverse().join("");
                if (original === reversed) {
                    return text + " is palindrome.";
                } else {
                    return text + " is not palindrome.";
                }
            }

            function runAll() {
                let text = document.getElementById("text").value;
                document.getElementById("task1").textContent = countL(text);
                document.getElementById("task2").textContent = countVowels(text);
                document.getElementById("task3").textContent = checkPalindrome(text);
            }
        </script>
    </body>
</html>
